version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: regz-postgres
    restart: always
    environment:
      POSTGRES_USER: regz_user
      POSTGRES_PASSWORD: regz_password
      POSTGRES_DB: regz_db
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - regz_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regz_user -d regz_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: regz-app
    restart: always
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgres://regz_user:regz_password@postgres:5432/regz_db
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: regz_user
      DB_PASSWORD: regz_password
      DB_NAME: regz_db
    ports:
      - "${FRONTEND_PORT:-8280}:4000"
    depends_on:
      postgres:
        condition: service_healthy

  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    container_name: regz-duckdns
    restart: always
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
      - SUBDOMAINS=${DUCKDNS_SUBDOMAINS:-regiz-app}
      - TOKEN=${DUCKDNS_TOKEN}
      - LOG_FILE=true

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: regz-tunnel
    restart: always
    command: tunnel --url http://frontend:4000
    depends_on:
      - frontend

volumes:
  regz_postgres_data:
    driver: local
