version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: regz-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-regz_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-regz_password}
      POSTGRES_DB: ${POSTGRES_DB:-regz_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-regz_user} -d ${POSTGRES_DB:-regz_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: regz-backend
    restart: always
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-regz_user}:${POSTGRES_PASSWORD:-regz_password}@postgres:5432/${POSTGRES_DB:-regz_db}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-regz_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-regz_password}
      DB_NAME: ${POSTGRES_DB:-regz_db}
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: regz-frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
