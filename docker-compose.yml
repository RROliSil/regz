# Docker Compose preparado para Cloud 24/7 com Banco Online (DATABASE_URL)
# - Modo Cloud / Banco Online (padrão): docker compose up -d
#   Configure DATABASE_URL, DB_SSL=true e JWT_SECRET no arquivo .env ou no Portainer
# - Modo Desenvolvimento com PostgreSQL local opcional: docker compose --profile local-db up -d

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: regz-app
    restart: always
    environment:
      PORT: ${PORT:-4000}
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-}
      DB_SSL: ${DB_SSL:-true}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-regz_user}
      DB_PASSWORD: ${DB_PASSWORD:-regz_password}
      DB_NAME: ${DB_NAME:-regz_db}
      JWT_SECRET: ${JWT_SECRET:-regz_jwt_super_secret_key_2026}
      APP_URL: ${APP_URL:-}
    ports:
      - "${FRONTEND_PORT:-8280}:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Serviço opcional apenas para desenvolvimento offline local (use --profile local-db)
  postgres:
    profiles: ["local-db"]
    image: postgres:15-alpine
    pull_policy: if_not_present
    container_name: regz-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-regz_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-regz_password}
      POSTGRES_DB: ${DB_NAME:-regz_db}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - regz_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-regz_user} -d ${DB_NAME:-regz_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  regz_postgres_data:
    driver: local
